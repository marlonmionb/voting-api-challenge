services:
  postgres:
    image: postgres:16-alpine
    container_name: voting-api-postgres
    environment:
      POSTGRES_DB: voting_api
      POSTGRES_USER: voting_user
      POSTGRES_PASSWORD: voting_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voting_user -d voting_api"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
